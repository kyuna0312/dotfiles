# Sheldon plugin manifest. Plugins load in the order declared.
# Loaded eagerly (not deferred) so nightcity.zsh can override ZSH_HIGHLIGHT_STYLES
# and the autosuggest keybindings can bind to live widgets.
shell = "zsh"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# Must be last: it wraps existing ZLE widgets.
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
