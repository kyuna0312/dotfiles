add_newline = false
command_timeout = 500
palette = "lucy_edgerunner"

# Lucy Kushinada · Tide-style powerline prompt
# Line 1: ribbon[ os · dir · git ] ────── runtimes · duration · time
# Line 2: λ input marker
format = """
[](fg:lavender)\
$os\
[](fg:lavender bg:surface)\
$directory\
[](fg:surface bg:overlay)\
$git_branch\
$git_status\
[](fg:overlay)\
$fill\
$nodejs$python$golang$rust$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

# ── Core ──────────────────────────────────────────────────────────────────────

[fill]
symbol = "·"
style = "muted"

[character]
success_symbol = "[λ](bold sakura)"
error_symbol   = "[λ](bold rose)"
vicmd_symbol   = "[❮](bold cyan)"

# ── Left ribbon (background segments) ────────────────────────────────────────

[os]
disabled = false
style = "fg:base bg:lavender"
format = "[ $symbol]($style)"

[os.symbols]
Linux   = "󰌽"
Manjaro = "󱘊"
Arch    = "󰣇"
Macos   = "󰀵"
Windows = "󰍲"

[directory]
style = "fg:text bg:surface"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:rose bg:surface"

[directory.substitutions]
"~/.config"  = "󱁿 cfg"
"~/dotfiles" = "󰚩 dot"
"~/projects" = "󰲋 proj"
"~/Desktop"  = "󰇄 desk"

[git_branch]
symbol = " "
style = "fg:base bg:overlay"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:base bg:overlay"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "!"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "*${count}"
modified   = "~${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✗${count}"

# ── Right side (fg segments after the fill) ──────────────────────────────────

[nodejs]
symbol = " "
style = "mint"
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx", "json"]
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "gold"
format = "[$symbol$version]($style) "
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[rust]
symbol = "󱘗 "
style = "rose"
format = "[$symbol$version]($style) "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[docker_context]
symbol = " "
style = "cyan"
format = "[$symbol$context]($style) "
only_with_files = true
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]

[cmd_duration]
disabled = false
min_time = 1000
style = "muted"
format = "[⧖ $duration]($style) "

[time]
disabled = false
style = "gold"
format = "[$time]($style)"
time_format = "%H:%M"

# ── Palette — Lucy Edgerunner+ ────────────────────────────────────────────────

[palettes.lucy_edgerunner]
text     = "#f0e6ff"
muted    = "#c4b0d8"
sakura   = "#ff6bba"
rose     = "#ff4d8d"
lavender = "#c8a5ff"
cyan     = "#00e5ff"
mint     = "#9dffcc"
gold     = "#ffd97d"
peach    = "#ffb3a0"
base     = "#1a1426"
surface  = "#2a2140"
overlay  = "#3a2f55"
