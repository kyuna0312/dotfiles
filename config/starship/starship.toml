add_newline = false
command_timeout = 500
palette = "nightcity"

# NIGHT CITY · Tide-style powerline prompt
# Line 1: ribbon[ os · dir · git ] ────── runtimes · duration · time
# Line 2: λ input marker
format = """
[](fg:cyan)\
$username\
[](fg:cyan bg:surface)\
$directory\
[](fg:surface bg:overlay)\
$git_branch\
$git_status\
[](fg:overlay)\
$fill\
$nodejs$python$golang$rust$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

# ── Core ──────────────────────────────────────────────────────────────────────

[fill]
symbol = "·"
style = "muted"

[character]
success_symbol = "[λ](bold green)"
error_symbol   = "[λ](bold coral)"
vicmd_symbol   = "[❮](bold teal)"

# ── Left ribbon (background segments) ────────────────────────────────────────

# bobthefish-style user@host (craftzdog: theme_display_user yes, hostname always)
[username]
show_always = true
style_user = "fg:base bg:cyan"
style_root = "fg:coral bg:cyan"
format = "[ $user ]($style)"

[directory]
style = "fg:text bg:surface"
format = "[ $path ]($style)"
# fish_prompt_pwd_dir_length=1 look: ~/D/d/config — parents shortened to 1 char
truncation_length = 1
fish_style_pwd_dir_length = 1
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "fg:cyan bg:surface"

# No substitutions: starship disables fish-style abbreviation when any exist.

[git_branch]
symbol = " "
style = "fg:text bg:overlay"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:text bg:overlay"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "!"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "*${count}"
modified   = "~${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✗${count}"

# ── Right side (fg segments after the fill) ──────────────────────────────────

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx", "json"]
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[golang]
symbol = " "
style = "teal"
format = "[$symbol$version]($style) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[rust]
symbol = "󱘗 "
style = "coral"
format = "[$symbol$version]($style) "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[docker_context]
symbol = " "
style = "teal"
format = "[$symbol$context]($style) "
only_with_files = true
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]

[cmd_duration]
disabled = false
min_time = 1000
style = "muted"
format = "[⧖ $duration]($style) "

[time]
disabled = false
style = "yellow"
format = "[$time]($style)"
time_format = "%H:%M"

# ── Palette — NIGHT CITY ──────────────────────────────────────────────────────

# Aligned with the NIGHT CITY stack palette (tmux/ghostty/kitty/wezterm/ubersicht):
# deep blue-grey #101a1f ground, cyan #2bbcd5, yellow #f2c74b, teal #0cc7c2.
# Palette values are the Night City Mix set.
[palettes.nightcity]
cyan     = "#2bbcd5"
teal     = "#0cc7c2"
green    = "#49d575"
yellow   = "#f2c74b"
coral    = "#f37c4b"
purple   = "#be59d6"
muted    = "#5b7189"
text     = "#b6c5d3"
base     = "#101a1f"
surface  = "#15242d"
overlay  = "#1d2c36"
