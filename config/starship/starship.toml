add_newline = false
command_timeout = 500
palette = "arasaka"

# ARASAKA UI · Tide-style powerline prompt
# Line 1: ribbon[ os · dir · git ] ────── runtimes · duration · time
# Line 2: λ input marker
format = """
[](fg:lavender)\
$os\
[](fg:lavender bg:surface)\
$directory\
[](fg:surface bg:overlay)\
$git_branch\
$git_status\
[](fg:overlay)\
$fill\
$nodejs$python$golang$rust$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

# ── Core ──────────────────────────────────────────────────────────────────────

[fill]
symbol = "·"
style = "muted"

[character]
success_symbol = "[λ](bold sakura)"
error_symbol   = "[λ](bold rose)"
vicmd_symbol   = "[❮](bold cyan)"

# ── Left ribbon (background segments) ────────────────────────────────────────

[os]
disabled = false
style = "fg:base bg:lavender"
format = "[ $symbol]($style)"

[os.symbols]
Linux   = "󰌽"
Manjaro = "󱘊"
Arch    = "󰣇"
Macos   = "󰀵"
Windows = "󰍲"

[directory]
style = "fg:text bg:surface"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:rose bg:surface"

[directory.substitutions]
# Full-path forms (used outside a git repo) and the repo-root basenames
# (used inside a repo, where truncate_to_repo collapses the path to the
# repo folder name). Both are listed so the icon shows either way.
"~/.config"  = "󱁿 cfg"
"~/dotfiles" = "󰚩 dot"
"~/projects" = "󰲋 proj"
"~/Desktop"  = "󰇄 desk"
"dotfiles"   = "󰚩 dot"
".config"    = "󱁿 cfg"

[git_branch]
symbol = " "
style = "fg:text bg:overlay"
format = "[ $symbol$branch]($style)"

[git_status]
style = "fg:text bg:overlay"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "!"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "*${count}"
modified   = "~${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✗${count}"

# ── Right side (fg segments after the fill) ──────────────────────────────────

[nodejs]
symbol = " "
style = "mint"
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx", "json"]
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "gold"
format = "[$symbol$version]($style) "
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

[rust]
symbol = "󱘗 "
style = "rose"
format = "[$symbol$version]($style) "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[docker_context]
symbol = " "
style = "cyan"
format = "[$symbol$context]($style) "
only_with_files = true
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]

[cmd_duration]
disabled = false
min_time = 1000
style = "muted"
format = "[⧖ $duration]($style) "

[time]
disabled = false
style = "gold"
format = "[$time]($style)"
time_format = "%H:%M"

# ── Palette — ARASAKA UI ──────────────────────────────────────────────────────

# Aligned with the ARASAKA stack palette (tmux/ghostty/kitty/wezterm/ubersicht):
# black-red #080002 ground, red #ff1e3c, yellow #fce300, cyan #00ffc8.
# Palette values are the ARASAKA night-city set.
[palettes.arasaka]
text     = "#ff8f9c"
muted    = "#c25c6e"
sakura   = "#fce300"
rose     = "#ff1e3c"
lavender = "#ff1e3c"
cyan     = "#00ffc8"
mint     = "#7dffb5"
gold     = "#fce300"
peach    = "#ff6b7d"
base     = "#080002"
surface  = "#1a060a"
overlay  = "#3a0f16"
