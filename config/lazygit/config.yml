# lazygit — ARASAKA UI (Cyberpunk 2077)
# Same night-city palette as the rest of the stack.

# Route diffs through delta so they match the arasaka theme used everywhere
# else (git delta.gitconfig, bat). --paging=never lets lazygit own scrolling.
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#00ffc8"
      - bold
    inactiveBorderColor:
      - "#c25c6e"
    searchingActiveBorderColor:
      - "#ff1e3c"
      - bold
    optionsTextColor:
      - "#00b4ff"
    selectedLineBgColor:
      - "#3a0f16"
    inactiveViewSelectedLineBgColor:
      - "#1a060a"
    cherryPickedCommitFgColor:
      - "#080002"
    cherryPickedCommitBgColor:
      - "#ff29d4"
    markedBaseCommitFgColor:
      - "#080002"
    markedBaseCommitBgColor:
      - "#fce300"
    unstagedChangesColor:
      - "#ff1e3c"
    defaultFgColor:
      - "#ff4d5e"
  authorColors:
    "*": "#ff29d4"
