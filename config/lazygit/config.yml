# lazygit — Night City Mix
# Same deep blue-grey / teal palette as the rest of the stack.

# Route diffs through delta so they match the nightcity theme used everywhere
# else (git delta.gitconfig, bat). --paging=never lets lazygit own scrolling.
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#0cc7c2"
      - bold
    inactiveBorderColor:
      - "#5b7189"
    searchingActiveBorderColor:
      - "#2bbcd5"
      - bold
    optionsTextColor:
      - "#2bbcd5"
    selectedLineBgColor:
      - "#1d2c36"
    inactiveViewSelectedLineBgColor:
      - "#15242d"
    cherryPickedCommitFgColor:
      - "#101a1f"
    cherryPickedCommitBgColor:
      - "#be59d6"
    markedBaseCommitFgColor:
      - "#101a1f"
    markedBaseCommitBgColor:
      - "#f2c74b"
    unstagedChangesColor:
      - "#2bbcd5"
    defaultFgColor:
      - "#b6c5d3"
  authorColors:
    "*": "#be59d6"
