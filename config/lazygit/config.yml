# lazygit — LUCY UI (Cyberpunk: Edgerunners)
# Same night-city palette as the rest of the stack.

# Route diffs through delta so they match the lucy theme used everywhere
# else (git delta.gitconfig, bat). --paging=never lets lazygit own scrolling.
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#4fd1c5"
      - bold
    inactiveBorderColor:
      - "#52727a"
    searchingActiveBorderColor:
      - "#2aa298"
      - bold
    optionsTextColor:
      - "#2f879d"
    selectedLineBgColor:
      - "#0e3139"
    inactiveViewSelectedLineBgColor:
      - "#002d38"
    cherryPickedCommitFgColor:
      - "#00141a"
    cherryPickedCommitBgColor:
      - "#d33682"
    markedBaseCommitFgColor:
      - "#00141a"
    markedBaseCommitBgColor:
      - "#b28600"
    unstagedChangesColor:
      - "#2aa298"
    defaultFgColor:
      - "#839495"
  authorColors:
    "*": "#d33682"
