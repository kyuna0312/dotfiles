# lazygit — BOX UK Contrast (rainglow)
# Same deep blue-grey / teal palette as the rest of the stack.

# Route diffs through delta so they match the boxuk theme used everywhere
# else (git delta.gitconfig, bat). --paging=never lets lazygit own scrolling.
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never

gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#15b8ae"
      - bold
    inactiveBorderColor:
      - "#60778c"
    searchingActiveBorderColor:
      - "#017c9d"
      - bold
    optionsTextColor:
      - "#017c9d"
    selectedLineBgColor:
      - "#222c31"
    inactiveViewSelectedLineBgColor:
      - "#1b2228"
    cherryPickedCommitFgColor:
      - "#161e22"
    cherryPickedCommitBgColor:
      - "#b750ae"
    markedBaseCommitFgColor:
      - "#161e22"
    markedBaseCommitBgColor:
      - "#ffcb6e"
    unstagedChangesColor:
      - "#017c9d"
    defaultFgColor:
      - "#b8c7cc"
  authorColors:
    "*": "#b750ae"
