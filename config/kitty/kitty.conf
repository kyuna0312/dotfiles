# Kitty — H4CK3R // LUCY (Cyberpunk: Edgerunners, Lucy Kushinada)
# Same palette as the ghostty/tmux/zsh Lucy theming.

# ---- Font ----
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ---- Cursor ----
cursor_shape            block
cursor_blink_interval   0.6
cursor                  #00e5ff
cursor_text_color       #0a0a1a

# ---- Window ----
background_opacity      0.9
background_blur         20
window_padding_width    4
macos_option_as_alt     left
enable_audio_bell       no
visual_bell_duration    0.15

# ---- Lucy palette ----
foreground              #c4d0e0
background              #0a0a1a
selection_background    #2a2444
selection_foreground    #f0e6ff
url_color               #00e5ff
active_border_color     #45c2f0
inactive_border_color   #1a1a2e
bell_border_color       #ffa600

# Tab bar — neon magenta active tab, dim surface inactive
tab_bar_background      #0a0a1a
active_tab_foreground   #0a0a1a
active_tab_background   #ff2a7a
active_tab_font_style   bold
inactive_tab_foreground #5a6a7a
inactive_tab_background #0d0d1a

# normal
color0  #0d0d1a
color1  #ff2a7a
color2  #00ff41
color3  #ffa600
color4  #45c2f0
color5  #b967ff
color6  #00e5ff
color7  #c4d0e0

# bright
color8  #5a6a7a
color9  #ff6bba
color10 #7dff9e
color11 #ffc266
color12 #7dd3ff
color13 #d0a5ff
color14 #67e8f9
color15 #f0e6ff
