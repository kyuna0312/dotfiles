# Kitty — ARASAKA UI (CyberArch-Dotfiles, Cyberpunk 2077)
# Red-dominant surface (#ff1e3c), bright-yellow active tab, black-red bg.

# ---- Font ----
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ---- Cursor (red trail) ----
cursor_shape            beam
cursor_beam_thickness   2.2
cursor_blink_interval   0.5
cursor                  #ff1e3c
cursor_text_color       #080002
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ---- Window ----
background_opacity      0.8
background_blur         32
window_padding_width    16
macos_option_as_alt     left
enable_audio_bell       no
visual_bell_duration    0.12
visual_bell_color       #ff1e3c

# ---- ARASAKA palette ----
foreground              #ff4d5e
background              #080002
selection_background    #ff1e3c
selection_foreground    #080002
url_color               #ff4d5e
url_style               curly
active_border_color     #ff1e3c
inactive_border_color   #3a0f16
bell_border_color       #fce300

# Tab bar — slanted powerline, bright-yellow active tab (in-game panel cuts)
tab_bar_style           powerline
tab_powerline_style     angled
tab_activity_symbol     "⌁ "
tab_title_template      "{index}▸{title}"
tab_bar_background      #050102
active_tab_foreground   #080002
active_tab_background   #fce300
active_tab_font_style   bold
inactive_tab_foreground #c25c6e
inactive_tab_background #1a060a

# normal
color0  #0e0304
color1  #ff1e3c
color2  #39ff88
color3  #fce300
color4  #00b4ff
color5  #ff29d4
color6  #00ffc8
color7  #ff4d5e

# bright
color8  #5a1a24
color9  #ff6b7d
color10 #7dffb5
color11 #ffe66b
color12 #4dd2ff
color13 #ff7de8
color14 #5fffe0
color15 #ff8f9c
