# Kitty — LUCY UI (Cyberpunk: Edgerunners, solarized-osaka)
# Teal/cyan surface (#2aa298), yellow active tab, teal-black bg.

# ---- Font ----
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ---- Cursor (teal trail) ----
cursor_shape            beam
cursor_beam_thickness   2.2
cursor_blink_interval   0.5
cursor                  #2aa298
cursor_text_color       #00141a
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ---- Window ----
background_opacity      0.8
background_blur         32
window_padding_width    16
macos_option_as_alt     left
enable_audio_bell       no
visual_bell_duration    0.12
visual_bell_color       #2aa298

# ---- LUCY palette ----
foreground              #839495
background              #00141a
selection_background    #2aa298
selection_foreground    #00141a
url_color               #839495
url_style               curly
active_border_color     #2aa298
inactive_border_color   #0e3139
bell_border_color       #b28600

# Tab bar — slanted powerline, bright-yellow active tab (in-game panel cuts)
tab_bar_style           powerline
tab_powerline_style     angled
tab_activity_symbol     "⌁ "
tab_title_template      "{index}▸{title}"
tab_bar_background      #00141a
active_tab_foreground   #00141a
active_tab_background   #b28600
active_tab_font_style   bold
inactive_tab_foreground #52727a
inactive_tab_background #002d38

# ---- Keybindings (mirror Ghostty's macOS cmd-based scheme) ----
# Ghostty leans on its default super+key bindings; kitty's defaults use
# kitty_mod (ctrl+shift), so map the same actions onto cmd to match.

# Alt+arrows unbound to match ghostty (frees them for shell word-motion)
map alt+left  no_op
map alt+right no_op

# Tabs
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+shift+left  previous_tab
map cmd+shift+right next_tab

# Splits (kitty "windows" within a tab)
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down

# Font size
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# Window / misc
map cmd+enter       toggle_fullscreen
map cmd+shift+r     load_config_file
map cmd+shift+e     next_layout

# ---- Behavior ----
enabled_layouts splits,stack
confirm_os_window_close 0
macos_quit_when_last_window_closed yes
copy_on_select yes

# normal
color0  #00141a
color1  #2aa298
color2  #859900
color3  #b28600
color4  #2f879d
color5  #d33682
color6  #4fd1c5
color7  #839495

# bright
color8  #0e3139
color9  #4fd1c5
color10 #859900
color11 #b28600
color12 #2f879d
color13 #d33682
color14 #4fd1c5
color15 #839495
