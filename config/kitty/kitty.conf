# Kitty — Box UK Contrast (rainglow)
# Cyan surface (#017c9d), yellow active tab, deep blue-grey bg.

# ---- Font ----
font_family      Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ---- Cursor (cyan trail) ----
cursor_shape            beam
cursor_beam_thickness   2.2
cursor_blink_interval   0.5
cursor                  #017c9d
cursor_text_color       #161e22
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_trail_start_threshold 2

# ---- Window ----
background_opacity      0.8
background_blur         32
window_padding_width    16
macos_option_as_alt     left
enable_audio_bell       no
visual_bell_duration    0.12
visual_bell_color       #017c9d

# ---- Palette — from the night-city-palettes submodule ----
# ~/.config/themes -> themes/night-city-palettes (linked by install.sh).
# Swap the file name to switch palettes (e.g. box-uk-contrast.conf).
include ../themes/extras/kitty/night-city-mix.conf

# dotfiles-specific overrides on top of the shared theme
url_color               #b8c7cc
url_style               curly
inactive_border_color   #222c31
bell_border_color       #ffcb6e

# Tab bar — slanted powerline, bright-yellow active tab (in-game panel cuts)
tab_bar_style           powerline
tab_powerline_style     angled
tab_activity_symbol     "⌁ "
tab_title_template      "{index}▸{title}"
tab_bar_background      #161e22
active_tab_font_style   bold
inactive_tab_foreground #60778c
inactive_tab_background #1b2228

# ---- Keybindings (mirror Ghostty's macOS cmd-based scheme) ----
# Ghostty leans on its default super+key bindings; kitty's defaults use
# kitty_mod (ctrl+shift), so map the same actions onto cmd to match.

# Alt+arrows unbound to match ghostty (frees them for shell word-motion)
map alt+left  no_op
map alt+right no_op

# Tabs
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+shift+left  previous_tab
map cmd+shift+right next_tab

# Splits (kitty "windows" within a tab)
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down

# Font size
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# Window / misc
map cmd+enter       toggle_fullscreen
map cmd+shift+r     load_config_file
map cmd+shift+e     next_layout

# ---- Behavior ----
enabled_layouts splits,stack
confirm_os_window_close 0
macos_quit_when_last_window_closed yes
copy_on_select yes
