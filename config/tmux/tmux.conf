## BOX UK Contrast (rainglow) — CyberArch-Dotfiles
## Deep blue-grey / teal, cyan primary accent. Clean IDE layout.

# ---- Terminal / performance / UX ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g update-environment "TERM COLORTERM"

# Undercurl + colored underlines inside tmux (nvim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Terminal tab/window title follows the active pane
set -g set-titles on
set -g set-titles-string "#T"

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 200000
set -g aggressive-resize on

set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g set-clipboard on
set -g focus-events on

set -g visual-activity off
set -g visual-silence on

# ---- BOX UK palette ----
# bg:     #161e22     surface: #1b2228 / #1b2228
# cyan:   #017c9d     yellow:  #ffcb6e
# green:  #019d76     blue:    #017c9d
# purple: #b750ae     teal:    #15b8ae
# fg:     #b8c7cc     dim:     #60778c

# ---- Prefix & core ----
# Ctrl+Space — mirrors nvim's Space leader (bare Space can't be a prefix,
# you'd never be able to type spaces in the shell).
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: reloaded"

# ---- Pane navigation ----
# Handled by nyanvim's nvim-tmux-navigation directly from within nvim.

# ---- Pane resizing ----
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ---- Splits & windows ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind x kill-pane
bind c new-window -c "#{pane_current_path}"

# Reorder windows with Ctrl+Shift+←/→
bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# Open current directory in Finder
if-shell "uname | grep -q Darwin" \
  'bind F run-shell "open \"#{pane_current_path}\""'

# Copy mode (vi)
setw -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Vibe coding layouts ----
bind v split-window -h -p 30 -c "#{pane_current_path}"

bind e new-window -c "#{pane_current_path}" \;\
  send-keys "nvim ." Enter \;\
  split-window -h -p 30 -c "#{pane_current_path}" \;\
  select-pane -L

# ---- Developer popups ----
bind -r g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit

# ---- TPM + Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#017c9d'
set -g @floax-text-color '#b8c7cc'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# sessionx
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '#{HOME}/dotfiles'
set -g @sessionx-bind 's'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-additional-options "--color pointer:017c9d,spinner:017c9d,marker:019d76"

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'

# ---- AI CLI Tool Bindings ----
bind -r y run-shell '\
  DIR="#{pane_current_path}"; \
  SESSION="claude-$(printf "%s" "$DIR" | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null \
    || tmux new-session -d -s "$SESSION" -c "$DIR" "claude"; \
  tmux display-popup -w 90% -h 90% -E "tmux attach-session -t $SESSION"'
bind Y split-window -h -p 30 -c "#{pane_current_path}" "claude"

bind -r o run-shell '\
  DIR="#{pane_current_path}"; \
  SESSION="oc-$(printf "%s" "$DIR" | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null \
    || tmux new-session -d -s "$SESSION" -c "$DIR" "opencode"; \
  tmux display-popup -w 90% -h 90% -E "tmux attach-session -t $SESSION"'
bind O split-window -h -p 30 -c "#{pane_current_path}" "opencode"

# ---- NyanVim session manager (local plugin) ----
set -g @nyanvim_launch_key 'i'   # 'y' is taken by the claude popup above
run-shell ~/Desktop/nyan_tmux_session_manager/nyanvim_session_manager.tmux

# ---- Status bar (BOX UK /// VSCode refactor) ----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Base
set -g status-bg "#161e22"
set -g status-style "fg=#b8c7cc,bg=#161e22"

# Mode / messages — copy-mode selection uses the real selection token,
# command feedback answers in matrix green like a terminal should.
set -g mode-style "fg=#161e22,bg=#017c9d"
set -g message-style "fg=#019d76,bg=#1b2228"
set -g message-command-style "fg=#15b8ae,bg=#1b2228"

# Pane borders — red is the focus token everywhere else in the stack (aerospace borders, kitty)
set -g pane-border-style "fg=#222c31,bg=default"
set -g pane-active-border-style "fg=#017c9d,bg=default"
set -g pane-border-lines single

# Clock / pane numbers
set -g clock-mode-colour "#15b8ae"
set -g clock-mode-style 24
set -g display-panes-active-colour "#15b8ae"
set -g display-panes-colour "#60778c"

set -g status-left-length 80
set -g status-right-length 300

# Left: netrunner state badge — the block answers what tmux is doing:
#   normal      green  session name
#   prefix held gold   BREACH
#   copy mode   violet INTERCEPT
set -g status-left '#[fg=#161e22,bg=#{?client_prefix,#ffcb6e,#{?pane_in_mode,#b750ae,#019d76}},bold] #{?client_prefix,⚡ BREACH,#{?pane_in_mode,◉ INTERCEPT,⌁ #S}} #[default] '

# Window list: editor tabs — zoom flag on the active tab, gold on activity
setw -g window-status-separator " "
setw -g window-status-activity-style "bold,fg=#ffcb6e,bg=#161e22"
setw -g window-status-style "NONE,fg=#60778c,bg=#161e22"
setw -g window-status-format '#[fg=#60778c]╺ #I:#{pane_current_command} ╸#[default]'
setw -g window-status-bell-style "bold,fg=#ffcb6e,bg=#161e22"
setw -g window-status-current-format '#[fg=#017c9d]╺#[default]#[fg=#161e22,bg=#017c9d,bold] #I:#{pane_current_command}#{?window_zoomed_flag, ◎,} #[default]#[fg=#017c9d]╸#[default]'

# Right: chip rail — path / command / clock
set -g status-right '#[fg=#1b2228]#[default]#[fg=#017c9d,bg=#1b2228] 󰉖 #{=|-36|…:pane_current_path} #[default]#[fg=#222c31,bg=#1b2228]#[default]#[fg=#15b8ae,bg=#222c31] ⌁ #{pane_current_command} #[default]#[fg=#15b8ae,bg=#222c31]#[default]#[fg=#161e22,bg=#15b8ae,bold] 󰥔 %H:%M #[default]'

set -g status-keys vi

# ---- tmux-menus styling ----
set -g @menus_location_x 'C'
set -g @menus_location_y 'S'
set -g @menus_border_type 'rounded'
set -g @menus_format_title "'#[fg=#017c9d,align=centre]  ⚡ BOX UK ⚡ '"
set -g @menus_simple_style 'bg=#161e22'
set -g @menus_simple_style_border 'fg=#017c9d,bg=default'
set -g @menus_simple_style_selected 'fg=#161e22,bg=#019d76'
set -g @menus_nav_next '#[fg=#017c9d]→'
set -g @menus_nav_prev '#[fg=#017c9d]←'
set -g @menus_nav_home '#[fg=#019d76]⌂'
