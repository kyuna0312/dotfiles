## H4CK3R // LUCY — VSCode refactor
## Matrix green meets Night City neon. Clean IDE layout.

# ---- Terminal / performance / UX ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g update-environment "TERM COLORTERM"

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 200000
set -g aggressive-resize on

set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g set-clipboard on
set -g focus-events on

set -g visual-activity off
set -g visual-silence on

# ---- H4CK3R // LUCY palette ----
# bg:        #0a0a1a     surface:   #0d0d1a
# green:     #00ff41     green_dim: #003300
# lucy_blue: #45c2f0     magenta:   #ff2a7a
# gold:      #ffa600     cyan:      #00e5ff
# fg:        #c4d0e0     dim:       #5a6a7a

# ---- Prefix & core ----
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: reloaded"

# ---- Pane navigation ----
# Handled by nyanvim's nvim-tmux-navigation directly from within nvim.

# ---- Pane resizing ----
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ---- Splits & windows ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind x kill-pane
bind c new-window -c "#{pane_current_path}"

# Copy mode (vi)
setw -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Vibe coding layouts ----
bind v split-window -h -p 30 -c "#{pane_current_path}"

bind e new-window -c "#{pane_current_path}" \;\
  send-keys "nvim ." Enter \;\
  split-window -h -p 30 -c "#{pane_current_path}" \;\
  select-pane -L

# ---- Developer popups ----
bind -r g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit

# ---- TPM + Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/catppuccin-tmux'

# floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#45c2f0'
set -g @floax-text-color '#c4d0e0'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# sessionx
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '#{HOME}/dotfiles'
set -g @sessionx-bind 's'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-additional-options "--color pointer:45c2f0,spinner:ff2a7a,marker:00ff41"

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

# ---- AI CLI Tool Bindings ----
bind -r y run-shell '\
  DIR="#{pane_current_path}"; \
  SESSION="claude-$(printf "%s" "$DIR" | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null \
    || tmux new-session -d -s "$SESSION" -c "$DIR" "claude"; \
  tmux display-popup -w 90% -h 90% -E "tmux attach-session -t $SESSION"'
bind Y split-window -h -p 30 -c "#{pane_current_path}" "claude"

bind -r o run-shell '\
  DIR="#{pane_current_path}"; \
  SESSION="oc-$(printf "%s" "$DIR" | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null \
    || tmux new-session -d -s "$SESSION" -c "$DIR" "opencode"; \
  tmux display-popup -w 90% -h 90% -E "tmux attach-session -t $SESSION"'
bind O split-window -h -p 30 -c "#{pane_current_path}" "opencode"

# ---- Status bar (H4CK3R // LUCY /// VSCode refactor) ----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Base
set -g status-bg "#0a0a1a"
set -g status-style "fg=#c4d0e0,bg=#0a0a1a"

# Mode / messages
set -g mode-style "fg=#00ff41,bg=#0d0d1a"
set -g message-style "fg=#c4d0e0,bg=#0d0d1a"
set -g message-command-style "fg=#c4d0e0,bg=#0d0d1a"

# Pane borders
set -g pane-border-style "fg=#1a1a2e,bg=#000000"
set -g pane-active-border-style "fg=#45c2f0,bg=#000000"

set -g status-left-length 80
set -g status-right-length 300

# Left: VSCode-style badge — hacker lucy
set -g status-left '#[fg=#000000,bg=#00ff41,bold]  > LUCY < #[default]'

# Window list: VSCode editor tabs — centred
setw -g window-status-separator " "
setw -g window-status-activity-style "bold,fg=#ffa600,bg=#0a0a1a"
setw -g window-status-style "NONE,fg=#5a6a7a,bg=#0a0a1a"
setw -g window-status-format '#[fg=#5a6a7a]╺#[default]#[fg=#5a6a7a] #I:#{pane_current_command:t} #[default]#[fg=#5a6a7a]╸#[default]'
setw -g window-status-current-format '#[fg=#ff2a7a]╺#[default]#[fg=#000000,bg=#ff2a7a,bold] #I:#{pane_current_command:t} #[default]#[fg=#ff2a7a]╸#[default]'

# Right: VSCode-style activity bar — path \ cmd \ clock
set -g status-right '#[fg=#003300]#[default]#[fg=#a0b0a0,bg=#003300] #{=/40:pane_current_path} #[default]#[fg=#003300]#[default]#[fg=#000000,bg=#45c2f0,bold] #{pane_current_command} #[default]#[fg=#45c2f0]#[default]#[fg=#c4d0e0,bg=#0a0a1a] %H:%M #[default]'

set -g status-keys vi

# ---- tmux-menus styling ----
set -g @menus_location_x 'C'
set -g @menus_location_y 'S'
set -g @menus_border_type 'rounded'
set -g @menus_format_title "'#[fg=#ff2a7a,align=centre]  ⚡ LUCY ⚡ '"
set -g @menus_simple_style 'bg=#0a0a1a'
set -g @menus_simple_style_border 'fg=#45c2f0,bg=default'
set -g @menus_simple_style_selected 'fg=#000000,bg=#00ff41'
set -g @menus_nav_next '#[fg=#45c2f0]→'
set -g @menus_nav_prev '#[fg=#ff2a7a]←'
set -g @menus_nav_home '#[fg=#00ff41]⌂'
